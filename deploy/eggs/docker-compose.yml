services:
  mcp:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: eggs-jira-mcp:latest
    command: ["--transport", "streamable-http", "--stateless", "--port", "9000"]
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      JIRA_URL: https://jira.eggstech.io.vn
      JIRA_PERSONAL_TOKEN: placeholder
      ALLOW_GLOBAL_CRED_FALLBACK: "false"
      MCP_ALLOWED_URL_DOMAINS: jira.eggstech.io.vn
      EGGS_ENABLED: "true"
      EGGS_CONFIG: /config/config.yaml
      EGGS_BOT_TOKEN: ${EGGS_BOT_TOKEN}
      TOOLSETS: eggs,jira_agile,jira_attachments,jira_comments,jira_development,jira_fields,jira_forms,jira_issues,jira_links,jira_metrics,jira_project_analysis,jira_projects,jira_service_desk,jira_transitions,jira_users,jira_watchers,jira_worklog
      ENABLED_TOOLS: >-
        eggs_block,eggs_cancel,eggs_components,eggs_create_component,eggs_create_issue,eggs_daily_report,eggs_decide_reschedule,eggs_end_day,eggs_finish,eggs_flow_reschedule,eggs_log_work,eggs_migrate_epic,eggs_next,eggs_pending_approvals,eggs_plan_apply,eggs_plan_validate,eggs_qc_fail,eggs_qc_pass,eggs_qc_start,eggs_request_reschedule,eggs_rules,eggs_schedule,eggs_start,eggs_submit_qc,eggs_triage_close,eggs_triage_open,eggs_uat,eggs_unblock,eggs_update_description,eggs_version,eggs_whoami,eggs_workstream_status,jira_add_comment,jira_add_watcher,jira_create_issue_link,jira_create_remote_issue_link,jira_download_attachments,jira_edit_comment,jira_eggs_block,jira_eggs_cancel,jira_eggs_components,jira_eggs_create_component,jira_eggs_create_issue,jira_eggs_daily_report,jira_eggs_decide_reschedule,jira_eggs_end_day,jira_eggs_finish,jira_eggs_flow_reschedule,jira_eggs_log_work,jira_eggs_migrate_epic,jira_eggs_next,jira_eggs_pending_approvals,jira_eggs_plan_apply,jira_eggs_plan_validate,jira_eggs_qc_fail,jira_eggs_qc_pass,jira_eggs_qc_start,jira_eggs_request_reschedule,jira_eggs_rules,jira_eggs_schedule,jira_eggs_start,jira_eggs_submit_qc,jira_eggs_triage_close,jira_eggs_triage_open,jira_eggs_uat,jira_eggs_unblock,jira_eggs_update_description,jira_eggs_version,jira_eggs_whoami,jira_eggs_workstream_status,jira_get_agile_boards,jira_get_all_projects,jira_get_board_issues,jira_get_create_fields,jira_get_cross_project_dependencies,jira_get_field_options,jira_get_issue,jira_get_issue_dates,jira_get_issue_development_info,jira_get_issue_images,jira_get_issue_proforma_forms,jira_get_issue_sla,jira_get_issue_watchers,jira_get_issues_development_info,jira_get_link_types,jira_get_proforma_form_details,jira_get_project_components,jira_get_project_epic_hierarchy,jira_get_project_fields,jira_get_project_issue_types,jira_get_project_issues,jira_get_project_versions,jira_get_queue_issues,jira_get_request_type_fields,jira_get_request_types,jira_get_service_desk_for_project,jira_get_service_desk_queues,jira_get_sprint_issues,jira_get_sprints_from_board,jira_get_transitions,jira_get_user_profile,jira_get_worklog,jira_link_to_epic,jira_remove_issue_link,jira_remove_watcher,jira_search,jira_search_assignable_users,jira_search_fields,jira_search_projects
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  guardian:
    build:
      context: ../..
      dockerfile: deploy/eggs/Dockerfile.guardian
    image: eggs-jira-guardian:latest
    # Absolute path: supercronic re-execs argv[0] as a subreaper and fails with
    # "fork exec: no such file or directory" when started as plain "supercronic".
    entrypoint: ["/usr/local/bin/supercronic", "/deploy/crontab"]
    environment:
      JIRA_URL: https://jira.eggstech.io.vn
      EGGS_BOT_TOKEN: ${EGGS_BOT_TOKEN}
      EGGS_CONFIG: /config/config.yaml
      EGGS_WEBHOOKS: /config/chat/webhooks.yaml
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./crontab:/deploy/crontab:ro
      - ./config.yaml:/config/config.yaml:ro
      # Google Chat webhooks (secrets): chat/webhooks.yaml, from webhooks.example.yaml.
      # A directory mount, so editors that replace the file are seen on the next run.
      - ./chat:/config/chat:ro
    restart: unless-stopped
    depends_on:
      - mcp
