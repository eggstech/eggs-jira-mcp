# Eggs Jira MCP Configuration Example
# Copy to config.yaml and customize for your deployment.

lead_user: cuong.huynh
lead_chat_webhook: null
kit_min_version: 0.1.0
timezone: Asia/Ho_Chi_Minh
frozen_label: legacy-frozen
flagged_impediment_value: Impediment

# Working calendar & thresholds
thresholds:
  stale_working_days: 2
  unscheduled_window: 5
  interrupt_window: 5
  escalate_l1_after: 1
  escalate_l2_after: 2
  internal_block_escalate_after: 2
  qc_flow_buffer: 1

# Fixed-date Vietnam public holidays for 2026.
# NOTE: Lunar New Year (Tết Âm Lịch) and Hung Kings Commemoration (Giỗ Tổ Hùng Vương)
# holidays vary each year and must be added yearly.
holidays:
  - "2026-01-01"  # Tết Dương Lịch
  - "2026-04-30"  # Giải Phóng Miền Nam
  - "2026-05-01"  # Quốc Tế Lao Động
  - "2026-09-02"  # Quốc Khánh

# Jira Custom Field mappings (logical -> customfield_id)
fields:
  planned_start: customfield_10108
  planned_end: customfield_10109
  epic_link: null  # set via `eggs-guardian resolve-fields`
  flagged: null  # set via `eggs-guardian resolve-fields`
  qc_owner: null
  part: null
  reschedule_requester: null
  baseline_end: null
  proposed_end: null
  reschedule_reason: null
  reschedule_status: null
  reschedule_count: null
  qc_fail_count: null
  block_reason: null
  blocked_by: null
  blocked_since: null
  health_flags: null
  escalation_level: null
  escalation_owner: null
  health_since: null
  flow_progress: null
  forecast_end: null
  slip_days: null
  unscheduled_count: null

# Status mappings (logical -> Jira status name)
statuses:
  open: Open
  analyzing: Analyzing
  ready_for_dev: Ready For Dev
  todo: DEV To Do
  in_progress: Dev In Progress
  ready_for_qc: QC TO DO
  testing: Test In Progress
  ready_for_uat: Ready For UAT
  client_uat: Wait For Review
  done: Done
  cancelled: Cancelled

# Issue type mappings (logical -> list of Jira issue type names / aliases)
issue_types:
  epic:
    - Epic
  story:
    - Story
  dev_task:
    - Dev Task
  bug_sub:
    - Bug
  adhoc:
    - Ad-hoc Task
  bug:
    - Bug stand-alone

# Transition names (logical -> Jira transition name)
transitions:
  schedule: Schedule
  start: Start
  submit_qc: Submit QC
  start_test: Start Test
  qc_pass: QC Pass
  qc_fail: QC Fail
  cancel: Cancel
  request_reschedule: Request Reschedule
  approve_reschedule: Approve Reschedule
  reject_reschedule: Reject Reschedule
  block: Block
  unblock: Unblock
  confirm_no_impact: Confirm No Impact
  client_uat: Client UAT
  uat_signoff: UAT Sign-off
  uat_fail: UAT Fail

