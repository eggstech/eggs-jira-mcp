# Eggs Jira MCP Configuration Example
# Copy to config.yaml and customize for your deployment.

lead_user: cuong.huynh
jira_url: https://jira.eggstech.io.vn
lead_chat_webhook: null
kit_min_version: 0.1.0
timezone: Asia/Ho_Chi_Minh
frozen_label: legacy-frozen
flagged_impediment_value: Impediment
reschedule_pending_value: "Chờ duyệt"
reschedule_interrupt_value: "Chen ngang"
blocked_internal_value: "Nội bộ"
ops_epic_summary: "[OPS] Vận hành & Hotfix {month:02d}/{year}"
hotfix_prefix: "[HOTFIX]"
bot_user: eggsbot

# Working calendar & thresholds
thresholds:
  stale_working_days: 2
  unscheduled_window: 5
  interrupt_window: 5
  escalate_l1_after: 1
  escalate_l2_after: 2
  internal_block_escalate_after: 2
  qc_flow_buffer: 1
  triage_working_days: 1
  end_day_hour: 17
  unfreeze_window_days: 4

roles:
  lead_ba:
    - "Business Analysts"
    - "Administrators"
  qc:
    - "Testers"
  dev:
    - "Developers"

create_roles:
  bug:
    - qc
    - lead_ba
    - dev
  story:
    - qc
    - lead_ba
  adhoc:
    - qc
    - lead_ba
    - dev

component_roles:
  - lead_ba
  - qc

link_types:
  interrupts: "Interrupts"
  causes: "Causes"
  relates: "Relates"
  duplicates: "Duplicate"
  blocks: "Blocks"

# Fixed-date Vietnam public holidays for 2026.
# NOTE: Lunar New Year (Tết Âm Lịch) and Hung Kings Commemoration (Giỗ Tổ Hùng Vương)
# holidays vary each year and must be added yearly.
holidays:
  - "2026-01-01"  # Tết Dương Lịch
  - "2026-04-30"  # Giải Phóng Miền Nam
  - "2026-05-01"  # Quốc Tế Lao Động
  - "2026-09-02"  # Quốc Khánh

# Jira Custom Field mappings (logical -> customfield_id)
fields:
  planned_start: customfield_10108
  planned_end: customfield_10109
  epic_link: customfield_10100
  epic_name: customfield_10102
  flagged: customfield_10409
  qc_owner: customfield_10702
  part: customfield_10701
  reschedule_requester: customfield_10706
  baseline_end: customfield_10700
  proposed_end: customfield_10703
  reschedule_reason: customfield_10704
  reschedule_status: customfield_10705
  reschedule_count: customfield_10707
  qc_fail_count: customfield_10708
  block_reason: customfield_10709
  blocked_by: customfield_10710
  blocked_since: customfield_10711
  health_flags: customfield_10712
  escalation_level: customfield_10714
  escalation_owner: customfield_10715
  health_since: customfield_10713
  flow_progress: null
  forecast_end: customfield_10716
  slip_days: customfield_10717
  unscheduled_count: customfield_10718
  report_source: customfield_10719
  reported_by: customfield_10720
  reported_at: customfield_10721

# Status mappings (logical -> Jira status name)
statuses:
  open: Open
  analyzing: Analyzed
  ready_for_dev: Ready For Dev  # 10400
  todo: DEV To Do
  in_progress: Dev In Progress
  ready_for_qc: QC TO DO
  testing: Test In Progress
  ready_for_uat: Ready For UAT  # 10401
  client_uat: Wait For Review
  done: Done
  cancelled: Cancelled  # 10402

# Issue type mappings (logical -> list of Jira issue type names / aliases)
issue_types:
  epic:
    - Epic
  story:
    - Story
  dev_task:
    - Dev Task
  bug_sub:
    - Bug
  adhoc:
    - Ad-hoc Task
  bug:
    - Bug stand-alone
  report:
    - User Report

# Report resolutions (logical -> Jira resolution name)
report_resolutions:
  bug: Is a Bug
  guidance: User Guidance
  feature: Feature Request
  data_fix: Data/Config Fix
  duplicate: Duplicate
  cannot_reproduce: Cannot Reproduce
  third_party: Third-party Issue

# Transition names (logical -> Jira transition name)
transitions:
  schedule: Schedule
  start: Start
  submit_qc: Submit QC
  finish: Finish
  start_test: Start Test
  qc_pass: QC Pass
  qc_fail: QC Fail
  cancel: Cancel
  request_reschedule: Request Reschedule
  approve_reschedule: Approve Reschedule
  reject_reschedule: Reject Reschedule
  block: Block
  unblock: Unblock
  confirm_no_impact: Confirm No Impact
  client_uat: Client UAT
  uat_signoff: UAT Sign-off
  uat_fail: UAT Fail
  start_triage: Start Triage
  close_report: Close Report
  analysis_done: Analysis Done
  set_due: Set Due Date
  ready_for_dev: Ready For Dev
  close_epic: Close Epic

